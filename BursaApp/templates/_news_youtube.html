{% macro yt_embed(v, class='') %}
{% if v and v.id %}
<div class="bn-yt {{ class }}">
  <iframe
    src="{{ v.embed_url }}?rel=0&modestbranding=1"
    title="{{ v.title }}"
    loading="lazy"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
{% endif %}
{% endmacro %}
