<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A2#05 Giriş</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #08080e;
      --surface: #111118;
      --border: #2a2a38;
      --text: #f4f4fa;
      --muted: #7c7c94;
      --violet: #8b5cf6;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(139,92,246,0.2), transparent);
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
    }
    .logo {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--violet), #22d3ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; margin-bottom: 16px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: #0c0c12;
      color: var(--text); font-size: 14px; margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: var(--violet); }
    button {
      width: 100%; margin-top: 8px; padding: 12px;
      border: none; border-radius: 12px; cursor: pointer;
      font-weight: 700; font-size: 14px; color: #fff;
      background: linear-gradient(135deg, var(--violet), #6366f1);
    }
    .err {
      background: rgba(248,113,113,0.12); color: var(--red);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px; padding: 10px 12px;
      font-size: 13px; margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div class="logo">A2#05</div>
    <h1>Giriş</h1>
    <p>Mean Reversion dashboard</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label>Kullanıcı</label>
    <input name="username" autocomplete="username" required autofocus />
    <label>Şifre</label>
    <input name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Giriş yap</button>
  </form>
</body>
</html>
